# 构建 flatpak 包（Arch / 任意发行版通用）。
#
# 为什么单独一条工作流，不塞进 linux-deb.yml：
#   flatpak 要在构建机上装 flatpak + flatpak-builder 并从 Flathub 拉 23.08 的 runtime 和
#   org.electronjs.Electron2.BaseApp（几百 MB），慢且容易因为 Flathub 抖动而红。
#   跟 deb 混在一条里，deb 会被连累重跑。
#
# 为什么能在 Arch 上用：flatpak 自带 runtime，不依赖发行版的 glibc / 库版本；
#   装完 `flatpak install --user KHarness-*.flatpak` 即可，不需要 AUR/PKGBUILD。
#
# runtime 选 23.08 而不是 electron-builder 默认的 20.08：构建机是 ubuntu-22.04（glibc 2.35），
#   随包 node 与 better-sqlite3 / node-pty 都是在那上面编的；20.08 runtime 的 glibc 只有 2.31，
#   跑不起来。23.08 是 glibc 2.36，留有余量。
name: 构建 Linux flatpak

on:
  workflow_dispatch:      # Actions 页面手动点，分支选 main
  push:
    tags: ['v*']          # 和 deb 那条一样，打 v* tag 时顺手把 flatpak 附到 Release

permissions:
  contents: write         # 要建 Release、传产物

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 与 better-sqlite3 / node-pty 的 ABI 对齐（和 pack-prep 的说明一致）
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # flatpak-builder 要在用户命名空间里跑 bwrap。Ubuntu 24.04 那条内核（GitHub runner 现在用的
      # 就是 6.8.0-xx-azure）默认可能挡掉非特权 userns，症状是 flatpak 一句「status code 1」就死了。
      # 这个开关在不存在的内核上会报错，所以 best-effort，不作为失败。
      - name: 装 flatpak 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo '(没有这个开关，忽略)'

      # 单独一步报读数：真要是命名空间被挡，这里就能看到，不用猜 flatpak 为什么死
      - name: 探测非特权用户命名空间
        run: |
          unshare --user --map-root-user echo 'userns: OK' || echo '!! userns 不可用'
          bwrap --dev-bind / / true && echo 'bwrap: OK' || echo '!! bwrap 跑不了'
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true

      # 远程源要加**两份**：bundler 和我后面的预装步骤用的都是 `flatpak --user install`，
      # 而在这个 runner 上 `sudo flatpak remote-add`（系统级）那份对 --user 上下文不可见，
      # 症状就是「No remote refs found similar to 'flathub'」—— 它把 flathub 当成 ref 去搜了。
      - name: 添加 Flathub 源
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo '--- 系统级远程 ---' && flatpak remotes && echo '--- 用户级远程 ---' && flatpak remotes --user

      # 排查用的读数：node 版本、electron 的 dist 在不在、图标尺寸。
      # 注意这条必须排在三层 npm ci **之后** —— 第一轮就是排到了前面，
      # 于是 `ls node_modules/electron/dist` 必然失败，报的还是最不像原因的样（exit code 1）。
      # 概览页那条「Node.js 20 is deprecated」只是 checkout/setup-node 自身的告警，不是失败原因。
      - name: 装依赖（根：electron / electron-builder）
        run: npm ci

      - name: 装依赖（server：better-sqlite3 / node-pty 现场编译）
        run: npm ci --prefix server

      - name: 装依赖（client：vite）
        run: npm ci --prefix client

      - name: 构建机自检
        run: |
          node -v && npm -v && uname -m
          flatpak --version && flatpak-builder --version
          ls -d node_modules/electron/dist || { echo "!! electron 的 dist 没落地，electronDist 指的目录不存在"; exit 1; }
          node -e "const b=require('fs').readFileSync('icon.png').subarray(0,26);console.log('icon.png',b.readUInt32BE(16)+'x'+b.readUInt32BE(20))"
          node -e "const b=require('fs').readFileSync('icon-256.png').subarray(0,26);const w=b.readUInt32BE(16),h=b.readUInt32BE(20);console.log('icon-256.png',w+'x'+h);if(w>512||h>512){console.log('!! flatpak 图标必须 ≤512px');process.exit(1)}"

      - name: 构建前端
        run: npm run build --prefix client

      # 产出 build/runtime/node、build/icon.png、build/icons/256x256.png、build/server-payload/app（含隐私硬卡口）
      - name: 打包准备（pack-prep）
        run: node desktop/pack-prep.js

      # 先把三个 ref 显式装上，这样「哪个 runtime 拉不到」会红在独立一步里，
      # 而不是混进 flatpak-builder 那一大坨（bundler 自己也会装，装过就是 no-op 更新）。
      - name: 预装 runtime 与 BaseApp
        run: |
          flatpak --user install -y --no-deps --arch=x86_64 flathub org.freedesktop.Platform//23.08
          flatpak --user install -y --no-deps --arch=x86_64 flathub org.freedesktop.Sdk//23.08
          flatpak --user install -y --no-deps --arch=x86_64 flathub org.electronjs.Electron2.BaseApp//23.08
          # 别用 --columns=is-active：flatpak 1.12 没这个列名（会「Unknown column」直接红在这一步），
          # 默认列就够看装上了什么
          flatpak --user list

      # 只出 flatpak（-c 覆盖输出目录，避免和 deb / 本机 Windows 的 release-new 撞名）。
      # 权限口径写在 package.json 的 build.flatpak.finishArgs：filesystem=host + device=all
      # （Agent 要开任意位置的项目目录、终端要 /dev/ptmx），沙箱靠 zypak 兜 Chromium 的嵌套 bwrap。
      #
      # DEBUG 这一条不是可选项：@malept/flatpak-bundler 把每条 flatpak 命令和它们的
      # stdout/stderr 全喂给 debug 日志（spawnWithLogging），不开就是「status code 1」一个字都不给。
      - name: 打 flatpak
        env:
          DEBUG: '@malept/flatpak-bundler,electron-builder*'
        run: npx electron-builder --linux flatpak -c.directories.output=release-flatpak --publish never

      - name: 检查产物
        run: |
          ls -l release-flatpak/*.flatpak || { echo "!! 没出 .flatpak"; exit 1; }

      # 出得来包不等于装得上。三件事构建阶段一律看不出来，只能进沙箱真跑：
      #   ① 包装脚本里调的是 zypak-wrapper —— electron-builder **不会**自动加 zypak 模块
      #      （FlatpakTarget 只把 modules 原样透传），全靠 org.electronjs.Electron2.BaseApp 自带；
      #   ② 随包的 resources/runtime/node 是构建机（glibc 2.35）上编的，runtime 的 glibc 不够就起不来；
      #   ③ desktop 入口 / 包装脚本有没有落进 /app/bin。
      # 哪条红了就说明这个包在他 Arch 机器上是坏的，别等他装了再报。
      - name: 在沙箱里验产物
        run: |
          flatpak install --user -y release-flatpak/*.flatpak
          flatpak run --user --command=sh dev.kharness.desktop -ec 'ls -l /app/bin && grep -q zypak /app/bin/* || { echo "!! /app/bin 里的包装脚本没引用 zypak"; exit 1; }'
          flatpak run --user --command=sh dev.kharness.desktop -ec 'command -v zypak-wrapper || { echo "!! BaseApp 里没有 zypak-wrapper（Electron 起不来）"; exit 1; }'
          flatpak run --user --command=sh dev.kharness.desktop -ec '/app/lib/dev.kharness.desktop/resources/runtime/node -v || { echo "!! 随包 node 在这个 runtime 里跑不起来：glibc 不匹配，把 runtimeVersion 往上调"; exit 1; }'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kharness-flatpak
          path: release-flatpak/*.flatpak
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="flatpak 由 GitHub Actions 构建（run ${GITHUB_RUN_ID}），Arch 及其它发行版通用；Windows 安装包在本机出，不在这里。"
          gh release create "$TAG" release-flatpak/*.flatpak --title "KHarness $TAG" --notes "$NOTES" \
            || gh release upload "$TAG" release-flatpak/*.flatpak --clobber
